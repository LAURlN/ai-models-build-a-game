# US monthly list prices, excluding tax; accessed 2026-11-14.
# Select ACTUAL Pro tier first: unspecified ChatGPT Pro is now ambiguous.
# https://help.openai.com/en/articles/9793128-about-chatgpt-pro-tiers
# https://learn.chatgpt.com/docs/pricing (Pro currently has NO five-hour cap)
[subscriptions.codex]
plan = "ChatGPT Pro 100 (user's actual tier, confirmed 2026-11-14)"
monthly_usd = 100.0
monthly_eur_de = 103.0  # incl. VAT; evidence/agent-eval/PLAN-PRICES.md (2026-11-14)
windows = ["weekly"]

# https://one.google.com/about/google-ai-plans/ (price; 2026-11-14)
# https://antigravity.google/docs/plans/ (limits; 2026-11-14)
[subscriptions.antigravity]
plan = "Google AI Pro"
monthly_usd = 19.99
monthly_eur_de = 21.99  # incl. VAT; annual $199.99 / EUR 219.99
# User calibration 2026-11-14 (observed in T3 usage panel): $25 of API-priced Gemini tokens = 10% of the WEEKLY limit
# => weekly limit ~= $250 API-equivalent; subscription/API ratio = (19.99/4.345)/250 = 0.0184 (list) or (11/4.345)/250 = 0.0101 (paid).
weekly_limit_api_usd_equivalent = 250.0
windows = ["5h", "weekly"]

# https://support.claude.com/en/articles/8325606-what-is-the-pro-plan (2026-11-14)
# Five-hour session plus all-model weekly; discretionary model/feature caps.
[subscriptions.claudeAgent]
plan = "Claude Pro"
monthly_usd = 20.0
monthly_eur_de = 21.42  # incl. VAT; annual $200 / EUR 214.20
windows = ["5h", "weekly"]

