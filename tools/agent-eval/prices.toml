# Official USD per 1M tokens; accessed 2026-11-14. API equivalents, not bills.
# Empty = unknown, never free. Input = uncached; reasoning included in output.
# Write rates retained for research; aggregate creation without TTL split is n/a.
currency = "USD"

# All Sol standard/write rates: https://developers.openai.com/api/docs/pricing
# Threshold/multipliers: https://developers.openai.com/api/docs/models/gpt-6.1-sol
# Accessed 2026-11-14. >272K prompt: 2x input/cache, 1.5x output, full request.
[models."gpt-6.1-sol"]
input_per_million = 2.0
cached_input_per_million = 0.10
output_per_million = 10.0
cache_write_30m_per_million = 2.50
cache_write_12h_per_million = 5.0
long_context_threshold = 272000
long_input_multiplier = 2.0
long_output_multiplier = 1.5

# Priority renamed Fast; both API service_tier names supported.
